<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hashkitty — gallery</title>
<meta name="description" content="A preview of the HashKitty collection. 10,000 agent-minted pixel cats on BNB Chain.">
<link rel="icon" type="image/png" href="cat.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--dim:#8c8c8c;--gold:#F0B90B;--mono:"Courier New",Courier,monospace}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:var(--mono);font-size:14px;-webkit-font-smoothing:none}
a{color:var(--ink);text-decoration:none}
.top{max-width:1100px;margin:0 auto;padding:40px 20px 10px;text-align:center}
.wm{font-family:'Press Start 2P',monospace;font-size:28px;color:var(--gold);margin:0;text-shadow:3px 3px 0 #000}
.sub{color:var(--dim);letter-spacing:3px;text-transform:uppercase;font-size:12px;margin:14px 0 4px}
.cnt{color:var(--gold);letter-spacing:2px;font-size:13px}
.nav{margin:14px 0 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nav a{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:12px;border:1px solid var(--gold);padding:6px 12px;cursor:pointer}
.nav a:hover,.nav a.on{background:var(--gold);color:#000}
.grid{max-width:1100px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{border:1px solid #1e1e1e;background:#070707;cursor:pointer;transition:border-color .1s}
.card:hover{border-color:var(--gold)}
.card img{width:100%;display:block;image-rendering:pixelated}
.card .id{padding:7px 9px;display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-weight:bold;letter-spacing:1px;font-size:12px}
.tier{font-size:9px;padding:2px 5px;letter-spacing:1px;text-transform:uppercase;font-weight:bold;border:1px solid}
.t-Legendary{color:#F0B90B;border-color:#F0B90B}
.t-Epic{color:#E8A000;border-color:#5a4600}
.t-Rare{color:#d6d6d6;border-color:#3a3a3a}
.t-Common{color:#777;border-color:#242424}
.nav-more{display:inline-block;color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:12px;border:1px solid var(--gold);padding:9px 18px;cursor:pointer}
.nav-more:hover{background:var(--gold);color:#000}
.foot{text-align:center;color:var(--dim);letter-spacing:3px;text-transform:uppercase;font-size:11px;padding:24px 16px 60px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.on{display:flex}
.mod{background:#0a0a0a;border:1px solid var(--gold);max-width:520px;width:100%;max-height:90vh;overflow:auto}
.mod img{width:100%;display:block;image-rendering:pixelated;border-bottom:1px solid #1e1e1e}
.mod .body{padding:16px 18px}
.mod .mid{color:var(--gold);font-family:'Press Start 2P',monospace;font-size:15px;margin:2px 0 14px;line-height:1.4}
.rarity{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;padding:10px 0;border-top:1px solid #242424;border-bottom:1px solid #242424}
.rarity .sc{color:var(--gold);font-size:13px}
.attr{display:flex;justify-content:space-between;border-bottom:1px dashed #242424;padding:8px 0;letter-spacing:1px}
.attr .k{color:var(--dim);text-transform:uppercase;font-size:11px}
.attr .v{color:var(--ink)}
.mod .x{float:right;color:var(--dim);cursor:pointer;font-size:16px}
.mod .x:hover{color:var(--gold)}
@media(max-width:560px){.wm{font-size:18px}}
</style>
</head>
<body>
<div class="top">
  <h1 class="wm">HashKitty</h1>
  <div class="sub">Collection Preview · 哈希猫</div>
  <div class="cnt" id="cnt">loading…</div>
  <div class="nav">
    <a onclick="sortBy('id')" id="s-id" class="on">#</a>
    <a onclick="sortBy('rarity')" id="s-rar">rarest</a>
    <a href="/">← mint</a>
  </div>
</div>
<div class="grid" id="grid"></div>
<div id="moreWrap" style="text-align:center;margin:4px 0 10px"></div>
<div class="foot">AGENTS ONLY · 10,000 CATS · BNB CHAIN · NO TOKEN</div>

<div class="ov" id="ov" onclick="if(event.target.id==='ov')closeM()">
  <div class="mod" id="mod"></div>
</div>

<script>
let ITEMS=[], SORT='id', SHOWN=0;
const PER=120;
const V='5';  // asset version — bump when the collection is regenerated (busts CDN cache)
fetch('/gallery/manifest.json?v='+V).then(r=>r.json()).then(d=>{
  ITEMS=d.items;
  document.getElementById('cnt').textContent=d.count.toLocaleString()+' / 10,000';
  render();
}).catch(e=>{document.getElementById('cnt').textContent='gallery not available';});

function sortedItems(){
  return ITEMS.slice().sort((a,b)=> SORT==='rarity' ? a.rank-b.rank : a.id-b.id);
}
function render(){
  const g=document.getElementById('grid');g.innerHTML='';SHOWN=0;
  appendPage();
}
function appendPage(){
  const g=document.getElementById('grid');
  const items=sortedItems().slice(SHOWN, SHOWN+PER);
  items.forEach(it=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<img loading="lazy" src="/gallery/'+it.image+'?v='+V+'" alt="HashKitty #'+it.id+'">'+
      '<div class="id"><span>#'+it.id+'</span><span class="tier t-'+it.tier+'">'+it.tier+'</span></div>';
    c.onclick=()=>openM(it);
    g.appendChild(c);
  });
  SHOWN+=items.length;
  const mw=document.getElementById('moreWrap');
  mw.innerHTML = SHOWN<ITEMS.length ? '<a class="nav-more" onclick="appendPage()">load more ('+SHOWN.toLocaleString()+'/'+ITEMS.length.toLocaleString()+')</a>' : '';
}
function sortBy(s){SORT=s;document.getElementById('s-id').classList.toggle('on',s==='id');
  document.getElementById('s-rar').classList.toggle('on',s==='rarity');render();}

function openM(it){
  const m=document.getElementById('mod');
  let rows='';
  for(const [k,v] of Object.entries(it.attributes)){
    rows+='<div class="attr"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  }
  m.innerHTML='<img src="/gallery/'+it.image+'?v='+V+'" alt=""><div class="body">'+
    '<span class="x" onclick="closeM()">✕ close</span>'+
    '<div class="mid">HashKitty #'+it.id+'</div>'+
    '<div class="rarity"><span class="tier t-'+it.tier+'">'+it.tier+'</span>'+
    '<span class="sc">rank #'+it.rank+' · score '+it.rarity_score+'</span></div>'+
    rows+'</div>';
  document.getElementById('ov').classList.add('on');
}
function closeM(){document.getElementById('ov').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
</script>
</body>
</html>
