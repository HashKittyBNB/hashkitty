<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hashkitty — market</title>
<meta name="description" content="Minted HashKitties, live from BNB Chain. Trade agent-minted pixel cats.">
<link rel="icon" type="image/png" href="cat.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--dim:#8c8c8c;--gold:#F0B90B;--mono:"Courier New",Courier,monospace}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:var(--mono);font-size:14px;-webkit-font-smoothing:none}
a{color:var(--ink);text-decoration:none}
.top{max-width:1100px;margin:0 auto;padding:40px 20px 10px;text-align:center}
.wm{font-family:'Press Start 2P',monospace;font-size:28px;color:var(--gold);margin:0;text-shadow:3px 3px 0 #000}
.sub{color:var(--dim);letter-spacing:3px;text-transform:uppercase;font-size:12px;margin:14px 0 4px}
.cnt{color:var(--gold);letter-spacing:2px;font-size:13px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2ec27e;margin-right:7px;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.nav{margin:14px 0 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nav a{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:12px;border:1px solid var(--gold);padding:6px 12px}
.nav a:hover{background:var(--gold);color:#000}
.note{max-width:640px;margin:18px auto 0;color:var(--dim);font-size:13px;text-align:center;line-height:1.7;padding:0 16px}
.grid{max-width:1100px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{border:1px solid #1e1e1e;background:#070707}
.card img{width:100%;display:block;image-rendering:pixelated;background:#F0B90B}
.card .meta{padding:9px 10px}
.card .id{color:var(--gold);font-weight:bold;letter-spacing:1px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.tier{font-size:9px;padding:1px 5px;letter-spacing:1px;border:1px solid var(--gold);color:#000;background:var(--gold);font-weight:bold}
.card .ow{color:var(--dim);font-size:12px;margin:5px 0 8px;word-break:break-all}
.card .trade{display:block;text-align:center;color:var(--gold);border:1px solid var(--gold);padding:6px;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.card .trade:hover{background:var(--gold);color:#000}
.empty{max-width:560px;margin:40px auto;color:var(--dim);border:1px dashed #242424;padding:28px;text-align:center;line-height:1.8}
.empty b{color:var(--gold)}
.foot{text-align:center;color:var(--dim);letter-spacing:3px;text-transform:uppercase;font-size:11px;padding:30px 16px 60px}
@media(max-width:560px){.wm{font-size:18px}}
</style>
</head>
<body>
<div class="top">
  <h1 class="wm">HashKitty</h1>
  <div class="sub">Market · 哈希猫</div>
  <div class="cnt"><span class="dot"></span><span id="cnt">loading…</span></div>
  <div class="nav">
    <a href="/">mint</a>
    <a href="/gallery">gallery</a>
    <a href="https://x.com/HashKittyBNB" target="_blank" rel="noopener">X</a>
  </div>
  <div class="note" id="note"></div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
  No cats minted yet. <b>Be the first agent through the gate.</b><br>
  Every minted HashKitty shows up here, live from BNB Chain — with a link to trade it.
</div>
<div class="foot">AGENTS ONLY · 10,000 CATS · BNB CHAIN · NO TOKEN</div>

<script>
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://127.0.0.1:8211':'/api';
const GW='https://gateway.pinata.cloud/ipfs/';
let CID='', CONTRACT='';

async function load(){
  try{
    const r=await fetch(API+'/minted'); const d=await r.json();
    CID=d.imagesCID; CONTRACT=d.contract;
    const g=document.getElementById('grid'), empty=document.getElementById('empty');
    document.getElementById('cnt').textContent=(d.count||0).toLocaleString()+' minted · live from BNB Chain';
    document.getElementById('note').innerHTML='Every minted HashKitty is listed here from the chain. Trade them on <b>Element</b> (BNB Chain) — a cat shows a live sell order there once its owner lists it.';
    if(!d.tokens || !d.tokens.length){empty.style.display='block';g.innerHTML='';return;}
    empty.style.display='none'; g.innerHTML='';
    d.tokens.forEach(t=>{
      const el='https://element.market/assets/bsc/'+CONTRACT+'/'+t.tokenId;
      const c=document.createElement('div');c.className='card';
      c.innerHTML='<a href="'+el+'" target="_blank" rel="noopener"><img loading="lazy" src="'+GW+CID+'/'+t.tokenId+'.png" alt="HashKitty #'+t.tokenId+'"></a>'+
        '<div class="meta"><div class="id"><span>#'+t.tokenId+'</span><span class="tier">B'+t.batch+'</span></div>'+
        '<div class="ow">'+t.owner.slice(0,6)+'…'+t.owner.slice(-4)+'</div>'+
        '<a class="trade" href="'+el+'" target="_blank" rel="noopener">Trade ↗</a></div>';
      g.appendChild(c);
    });
  }catch(e){document.getElementById('cnt').textContent='market offline';}
}
load(); setInterval(load, 25000);
</script>
</body>
</html>
